version: "3.1"

stories:
  - story: user asks for hello world
    steps:
      - user: |
          hello world
        intent: ask_hello_world
      - action: utter_hello_world

  - story: user greets then says goodbye
    steps:
      - user: |
          hi
        intent: greet
      - action: utter_greet
      - user: |
          bye
        intent: goodbye
      - action: utter_goodbye
