<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hello Rasa — Chat Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; padding: 40px 16px; }
  .chat { width: 420px; background: #22223a; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .chat-header { background: #6c3ce9; padding: 16px; font-weight: 600; }
  .chat-log { height: 420px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 14px; }
  .msg.bot { background: #33334f; align-self: flex-start; }
  .msg.user { background: #6c3ce9; align-self: flex-end; }
  form { display: flex; border-top: 1px solid #33334f; }
  input { flex: 1; background: transparent; border: none; padding: 14px; color: #eee; font-size: 14px; outline: none; }
  button { background: #6c3ce9; border: none; color: white; padding: 0 20px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="chat">
  <div class="chat-header">Hello Rasa</div>
  <div class="chat-log" id="log"></div>
  <form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>
<script>
  const RASA_URL = "http://localhost:5010/webhooks/rest/webhook";
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function send(message) {
    addMessage(message, "user");
    const res = await fetch(RASA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: "webchat-demo", message }),
    });
    const replies = await res.json();
    for (const r of replies) {
      if (r.text) addMessage(r.text, "bot");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send(message);
  });

  send("/greet");
</script>
</body>
</html>
