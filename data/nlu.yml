version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - good morning
      - good evening
      - hey there
      - what's up

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you around
      - see you later
      - talk to you later
      - catch you later

  - intent: ask_hello_world
    examples: |
      - hello world
      - say hello world
      - can you say hello world
      - print hello world
      - do the hello world thing
      - show me hello world

  - intent: affirm
    examples: |
      - yes
      - y
      - indeed
      - of course
      - that sounds good
      - correct

  - intent: deny
    examples: |
      - no
      - n
      - never
      - I don't think so
      - don't
      - no way
