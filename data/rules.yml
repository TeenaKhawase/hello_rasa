version: "3.1"

rules:
  - rule: Say hello world when asked
    steps:
      - intent: ask_hello_world
      - action: utter_hello_world

  - rule: Greet the user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
