# Talk to the assistant from the command line for Session 1 — no changes needed here.
rest:
#  # you can leave this empty to just enable the REST channel

rasa:
  url: "http://localhost:5002/api"

# Enables a browser chat widget (see webchat_demo.html) via `rasa run --enable-api`.
socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: true
